name: 수집·빌드·배포

on:
  schedule:
    # 평일 07~21시(KST) 20분마다. GitHub 예약 실행은 늦거나 빠질 수 있다
    - cron: '*/20 22-23 * * 0-4'
    - cron: '*/20 0-11 * * 1-5'
    # 그 밖에는 6시간마다(미국 내부자 매수용)
    - cron: '7 */6 * * *'
  workflow_dispatch:
    inputs:
      rebuild_only:
        description: '수집 없이 다시 빌드만(외부 호출 0회)'
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 수집 데이터는 data 브랜치에 쌓는다. 첫 실행에는 브랜치가 없어 실패해도 넘어간다
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: data
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: 수집
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.rebuild_only)
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: node scripts/collect.js
      - name: 데이터 저장
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && !inputs.rebuild_only)
        working-directory: data
        run: |
          if [ ! -d .git ]; then
            git init -q -b data
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
          fi
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add -A
          git commit -q -m "data $(date -u +%FT%TZ)" || exit 0
          git push -q origin data
      - run: node scripts/build.js --site "${{ vars.SITE_URL || 'https://six-ju.github.io/jaeryonote' }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
